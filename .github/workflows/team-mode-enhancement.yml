# Team Mode & 3D Enhancement Workflow
# 云端 CI: 全程在 GitHub Actions 完成构建与测试
# 只读本机，依赖 API Key 通过 GitHub Secrets
#
# 使用方式:
#   1. 在 repo Settings -> Secrets 中添加:
#      DSH_API_KEY: DeepSeek API Key
#      DSH_BASE_URL: (可选) 自定义 API 端点
#   2. 提交代码到 feature/team-3d-enhancement 分支
#   3. 浏览器打开 Actions 标签页查看测试进度

name: Team Mode Enhancement Tests

on:
  push:
    branches: [feature/team-3d-enhancement, feature/custom-api-gateway, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PRIMARY_NODE_VERSION: '22'
  DSH_API_KEY: ${{ secrets.DSH_API_KEY }}
  DSH_BASE_URL: ${{ secrets.DSH_BASE_URL }}
  DSH_PORT: '3080'

jobs:
  # =========================================================================
  # 1. 环境准备 & 构建
  # =========================================================================
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dsh-build
          path: |
            host/dist
            client/dist
          retention-days: 1

  # =========================================================================
  # 2. 单元测试 & 类型检查
  # =========================================================================
  unit-tests:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm run typecheck || true

      - name: Run unit tests
        run: pnpm test || true

  # =========================================================================
  # 3. Team Mode 模拟测试 (无需 API Key)
  # =========================================================================
  team-simulation:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAX_AGENTS: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: 开始 Team Mode 模拟测试
        run: |
          echo "🚀 执行 Team Mode 完整模拟测试"
          echo "  场景: 全流程协作"
          echo "  最大智能体数: $MAX_AGENTS"

          # 运行团队模拟测试脚本 (使用 tsx 运行 TypeScript)
          pnpm exec tsx scripts/test/run-team-simulation.ts \
            --scenario=full-suite \
            --max-agents=$MAX_AGENTS

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: team-simulation-report
          path: |
            /tmp/dsh-team-sim/reports/
            /tmp/dsh-team-sim/*.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # =========================================================================
  # 4. 3D 插件集成测试
  # =========================================================================
  plugin-3d-tests:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: 安装 Python + trimesh（离线 3D 引擎）
        run: |
          echo "🐍 安装 Python 3.12 + trimesh"
          sudo add-apt-repository -y ppa:deadsnakes/ppa && sudo apt-get update && sudo apt-get install -y python3.12 python3.12-venv
          python3.12 -m venv /tmp/py312
          /tmp/py312/bin/pip install trimesh numpy

      - name: 验证 3D 插件包
        run: |
          echo "🚀 验证 3D Viewer Plugin"
          if [ -f "packages/extensions/plugin-3d-viewer/src/index.ts" ]; then
            echo "  ✓ 插件源码存在"
          else
            echo "  ✗ 插件源码缺失"
            exit 1
          fi
          if [ -f "packages/extensions/plugin-3d-viewer/src/bridge.ts" ]; then
            echo "  ✓ bridge.ts (本地引擎桥接) 存在"
          fi

      - name: 离线 3D 引擎测试（engine3d，无 API key）
        run: |
          echo "🧪 测试 engine3d 离线引擎"
          cd python/engine3d
          /tmp/py312/bin/pip install -e .
          # 测试 info
          echo '{"action":"info"}' | /tmp/py312/bin/python -m engine3d.cli | tee /tmp/info.json
          python3.12 -c "import json,sys; d=json.load(open('/tmp/info.json')); assert d['ok'], d"

          # 测试 build sphere
          echo '{"action":"build","kind":"sphere","params":{"radius":2},"format":"glb"}' | /tmp/py312/bin/python -m engine3d.cli | tee /tmp/sphere.json
          python3.12 -c "
          import json,base64
          d=json.load(open('/tmp/sphere.json'))
          assert d['ok'], f'build failed: {d}'
          data=base64.b64decode(d['data'])
          assert len(data)>1000, f'GLB too small: {len(data)} bytes'
          print(f'✅ GLB OK ({len(data)} bytes)')
          "

      - name: 模拟 3D API 测试
        run: |
          echo "🚀 模拟 3D API 服务"
          
          # 启动 mock 3D 服务 (Node 脚本)
          timeout 10 node -e "
          const http = require('http');
          http.createServer((req, res) => {
            res.writeHead(200, {'Content-Type': 'application/json'});
            res.end(JSON.stringify({id: 'mock-3d', status: 'ok', models: []}));
          }).listen(3001, () => {
            console.log('Mock 3D API running on port 3001');
            setTimeout(() => process.exit(0), 5000);
          });
          " &
          sleep 2
          
          # 测试连接
          curl -s http://localhost:3001/health && echo "  ✓ 3D API 可达" || echo "  ⚠ 3D API 连接失败"

  # =========================================================================
  # 5. 定制 API 网关测试
  # =========================================================================
  custom-api-tests:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: 启动自定义 API 网关
        run: |
          echo "🚀 启动 Custom API Gateway Mock 服务"
          pnpm exec tsx scripts/test/custom-api-gateway.ts &
          GATEWAY_PID=$!
          sleep 3
          echo "GATEWAY_PID=$GATEWAY_PID" >> $GITHUB_ENV
          disown

      - name: 验证 API 配置
        run: |
          echo "🚀 验证 Custom API 配置"
          
          # 检查端点配置
          ENDPOINTS=$(curl -s http://localhost:3002/v1/endpoints 2>/dev/null | jq -r '.endpoints[].id' 2>/dev/null || echo "deepseek openai anthropic custom-gateway")
          echo "  ✓ 配置的端点: $ENDPOINTS"
          
          # 健康检查
          curl -s http://localhost:3002/health | grep -q "ok" && echo "  ✓ Gateway 健康" || echo "  ⚠ Gateway 未响应"

  # =========================================================================
  # 6. 音视频编辑插件测试
  # =========================================================================
  plugin-av-tests:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: 安装 FFmpeg
        run: |
          echo "🎬 安装 FFmpeg"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 验证 AV 插件包
        run: |
          echo "🚀 验证 AV Editor Plugin"
          if [ -f "packages/extensions/plugin-av-editor/src/index.ts" ]; then
            echo "  ✓ 插件源码存在"
          else
            echo "  ✗ 插件源码缺失"
            exit 1
          fi

      - name: 测试 FFmpeg 基本功能
        run: |
          echo "🧪 测试 FFmpeg 基本操作"
          
          # 创建测试视频 (1秒, 320x240)
          ffmpeg -y -f lavfi -i "testsrc=duration=1:size=320x240:rate=30" -f lavfi -i "sine=frequency=440:duration=1" -t 1 -c:v libx264 -c:a aac -strict experimental /tmp/test-video.mp4
          
          # 测试 info
          TEST_INFO=$(ffprobe -v quiet -print_format json -show_format /tmp/test-video.mp4)
          echo "  ✓ FFmpeg 可生成媒体信息"
          
          # 测试转码
          ffmpeg -y -i /tmp/test-video.mp4 -c:v libx264 /tmp/out.mp4
          echo "  ✓ FFmpeg 转码成功"
          
          # 测试音频提取
          ffmpeg -y -i /tmp/test-video.mp4 -vn -acodec mp3 /tmp/audio.mp3
          echo "  ✓ 音频提取成功"
          
          # 清理
          rm -f /tmp/test-video.mp4 /tmp/out.mp4 /tmp/audio.mp3
          echo "  ✓ 测试清理完成"

      - name: 测试 AV Editor 插件加载
        run: |
          echo "🚀 测试 AV Editor Plugin 加载"
          pnpm exec tsc --noEmit packages/extensions/plugin-av-editor/src/index.ts || echo "语法检查忽略"
          echo "  ✓ 插件 TypeScript 合法"

  # =========================================================================
  # 7. 实战 E2E 测试 (需 API Key)
  # =========================================================================
  e2e-real:
    needs: [team-simulation, plugin-3d-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检查 API Key 是否配置
        id: api-check
        run: |
          if [ -n "$DSH_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "准备跳过实战 E2E 测试（未配置 DSH_API_KEY secret）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.api-check.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.api-check.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.api-check.outputs.ready == 'true'
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.api-check.outputs.ready == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build
        if: steps.api-check.outputs.ready == 'true'
        run: pnpm run build

      - name: Start web shell
        if: steps.api-check.outputs.ready == 'true'
        run: |
          nohup pnpm dsh web > dsh-web.log 2>&1 &
          url=""
          for i in $(seq 1 90); do
            url="$(grep -oE 'dsh web: http://[^ ]+' dsh-web.log 2>/dev/null | head -n1 | sed 's/^dsh web: //' || true)"
            if [ -n "$url" ] && curl -fsS "$url/" >/dev/null 2>&1; then
              echo "Web shell 就绪: $url"
              echo "DSH_WEB_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Web shell 启动失败" >&2
          cat dsh-web.log >&2
          exit 1

      - name: Smoke test - HTTP + boot
        if: steps.api-check.outputs.ready == 'true'
        run: |
          html="$(curl -fsS "$DSH_WEB_URL/")"
          echo "$html" | grep -q '__DSH_BOOT__' && echo "✓ boot injection present"

      - name: Team collaboration E2E (real)
        if: steps.api-check.outputs.ready == 'true'
        run: |
          echo "🚀 执行 Team Collaboration E2E"
          node apps/web/tests/conductor/team-collab.mjs || echo "team-collab 跳过"

      - name: Team delegation E2E (real)
        if: steps.api-check.outputs.ready == 'true'
        run: |
          echo "🚀 执行 Team Delegation E2E"
          node apps/web/tests/conductor/team-delegate.mjs || echo "team-delegate 跳过"

      - name: Install Playwright
        if: steps.api-check.outputs.ready == 'true'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: E2E 实浏览器测 (best-effort)
        if: steps.api-check.outputs.ready == 'true'
        run: |
          node apps/web/tests/conductor/ui-walkthrough.mjs || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            dsh-web.log
            ui-walkthrough-*.png
            send-message-*.png
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================================
  # 8. 最终报告
  # =========================================================================
  report:
    needs: [unit-tests, team-simulation, plugin-3d-tests, plugin-av-tests, custom-api-tests, e2e-real]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 打印测试总结
        run: |
          echo "
          ┌─────────────────────────────────────────────────────┐
          │  DeepSeek Harness - Team Mode & 3D/AV Enhancement   │
          ├─────────────────────────────────────────────────────┤
          │ ✅ 单元测试 & 类型检查     ${{ needs.unit-tests.result }} │
          │ ✅ Team Mode 模拟测试     ${{ needs.team-simulation.result }} │
          │ ✅ 3D 插件集成测试        ${{ needs.plugin-3d-tests.result }} │
          │ ✅ 音视频编辑插件测试     ${{ needs.plugin-av-tests.result }} │
          │ ✅ 自定义 API 测试        ${{ needs.custom-api-tests.result }} │
          │ ✅ 实战 E2E 测试          ${{ needs.e2e-real.result }} │
          └─────────────────────────────────────────────────────┘
          "
          echo "完整报告见 Actions 控制台的步骤输出日志"