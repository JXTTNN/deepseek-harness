name: Fix Lockfile (one-time)

on:
  workflow_dispatch:
  push:
    branches:
      - fix-lockfile-trigger

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        run: |
          pnpm install --no-frozen-lockfile
          echo "Lockfile regenerated"

      - name: Check if lockfile changed
        id: changed
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat pnpm-lock.yaml
          fi

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): regenerate pnpm-lock.yaml to sync with package.json

          This fixes all --frozen-lockfile failures across workflows.
          Generated by fix-lockfile one-time workflow."
          git push