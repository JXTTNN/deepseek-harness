name: Cloud Detect

# Cloud-native detection lane for the team-mode fork: build the workspace,
# serve the real `dsh web` shell (which injects window.__DSH_BOOT__), assert the
# shell is reachable over HTTP, and run a Playwright real-browser delete-flow
# test. Runs on standard hosted runners so it works on any public fork.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PRIMARY_NODE_VERSION: '24'
  # Map the repo's stored secrets onto the names the harness actually reads
  # (packages/llm/llm-deepseek reads DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL).
  DEEPSEEK_API_KEY: ${{ secrets.DSH_API_KEY }}
  DEEPSEEK_BASE_URL: ${{ secrets.DSH_BASE_URL }}
  # Optional model id for the raw endpoint probe; empty falls back to deepseek-chat.
  DSH_MODEL_NAME: ${{ secrets.DSH_MODEL }}
  # The web shell serves on 3080 by default.
  DSH_PORT: '3080'

jobs:
  cloud-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Start web shell
        run: |
          nohup pnpm dsh web > dsh-web.log 2>&1 &
          # The shell prints its bound URL ("dsh web: http://127.0.0.1:PORT");
          # parse it instead of hardcoding a port (default is 8300, configurable
          # only via `dsh web --port`, NOT via DSH_PORT).
          url=""
          for i in $(seq 1 90); do
            url="$(grep -oE 'dsh web: http://[^ ]+' dsh-web.log | head -n1 | sed 's/^dsh web: //')"
            if [ -n "$url" ] && curl -fsS "$url/" >/dev/null 2>&1; then
              echo "web shell ready at $url after ${i}s"
              echo "DSH_WEB_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "web shell failed to start" >&2
          cat dsh-web.log >&2
          exit 1

      - name: Smoke — HTTP 200 and boot injection
        run: |
          html="$(curl -fsS "$DSH_WEB_URL/")"
          echo "$html" | grep -q '__DSH_BOOT__' && echo "boot injection present"
          echo "$html" | head -c 400

      # Raw endpoint probe, independent of the harness stack: a failing
      # team-collab with a failing probe is a credential/endpoint problem; a
      # failing team-collab with a passing probe is a harness problem. The key
      # is never echoed; the body is printed through a sk- redaction filter.
      - name: Diagnose — raw LLM endpoint probe
        id: llm-probe
        run: |
          base="${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
          model="${DSH_MODEL_NAME:-deepseek-chat}"
          body=$(printf '{"model":"%s","messages":[{"role":"user","content":"ping"}],"max_tokens":4,"stream":false}' "$model")
          code=$(curl -sS -o llm-probe.json -w '%{http_code}' \
            -X POST "$base/chat/completions" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$body" --max-time 60) || code="curl-failed"
          echo "llm probe http_status=$code model=$model base=$base"
          head -c 800 llm-probe.json | sed -E 's/(sk-[A-Za-z0-9_-]{4,})/[REDACTED]/g' || true
          echo
          echo "status=$code" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Verify — session delete removes files (API)
        run: node apps/web/tests/conductor/delete-api-verify.mjs

      - name: Verify — team peer discovery (presence)
        run: node apps/web/tests/conductor/team-find-peer.mjs

      - name: Verify — cross-process lock (no data loss)
        run: node apps/web/tests/conductor/lock-test.mjs

      - name: Verify — team agent invokes team tools (LLM end-to-end)
        run: node apps/web/tests/conductor/team-collab.mjs

      - name: Verify — auto model discovery
        run: node apps/web/tests/conductor/discover-models.mjs

      - name: E2E — real-browser UI probe (best-effort)
        run: node apps/web/tests/conductor/delete-flow.mjs
        continue-on-error: true

      - name: E2E — real-browser send-message (best-effort)
        run: node apps/web/tests/conductor/send-message.mjs
        continue-on-error: true

      # Full real-person walkthrough: every primary surface via clicks+typing
      # only. Starts best-effort while its CI picker path (browse dialog on
      # headless linux) gets proven; promote to required on next green run.
      - name: E2E — real-browser full UI walkthrough (best-effort)
        run: node apps/web/tests/conductor/ui-walkthrough.mjs
        continue-on-error: true

      - name: Verify — team lead delegates to a worker (multi-agent, best-effort)
        run: node apps/web/tests/conductor/team-delegate.mjs
        continue-on-error: true

      # Session event logs carry the llm/retry failure payloads team-collab
      # only prints on failure — upload them as durable evidence for review.
      - name: Upload session logs (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-detect-session-logs
          path: |
            ~/.dsh/sessions/**
            llm-probe.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload evidence (log + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-detect-evidence
          path: |
            dsh-web.log
            llm-probe.json
            delete-flow-*.png
            send-message-*.png
            walkthrough-*.png
          if-no-files-found: ignore
          retention-days: 7
