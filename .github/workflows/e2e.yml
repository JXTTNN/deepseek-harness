name: E2E (real API)

# Real-API end-to-end suite (`pnpm run test:e2e`). Supports any OpenAI-compatible
# API via DEEPSEEK_BASE_URL (defaults to https://api.deepseek.com). When using a
# non-DeepSeek endpoint, official-only suites (model-specific assertions) are
# auto-skipped by vitest.e2e.config.ts; generic agent-flow e2e (fs, shell,
# headless, web) runs against whatever endpoint is configured.
#
# Custom API configuration:
#   - workflow_dispatch inputs: api_base_url, model (override at trigger time)
#   - Secrets: CUSTOM_API_KEY or DEEPSEEK_API_KEY_EXTERNAL or DSH_API_KEY
#   - Base URL: inputs.api_base_url or secrets.DSH_BASE_URL or default
#
# pull_request IS a trigger, but GitHub withholds repo secrets from BOTH forked
# PRs and Dependabot PRs (the latter are same-repo, fork==false, but still
# keyless). The job-level `if:` below skips the whole job for those untrusted
# PRs. The Dependabot test keys on the PR AUTHOR (pull_request.user.login), not
# github.actor (the run trigger) — a maintainer reopening a Dependabot PR would
# make github.actor human while the PR is still keyless. When the job runs, the
# secret is expected, so the preflight hard-fails if it's missing (a missing
# secret would otherwise make the self-skipping suite report a false green). A
# job skipped by a job-level `if:` reports as a SUCCESSFUL check, so this
# workflow is safe to use as a required status check if desired.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Custom API base URL (e.g. https://api.openai.com/v1, https://api.deepseek.com). Leave empty to use secret/default.'
        required: false
        type: string
        default: ''
      model:
        description: 'Custom model name override (e.g. deepseek-chat, gpt-4o). Leave empty for default.'
        required: false
        type: string
        default: ''
      max_workers:
        description: 'Max parallel test workers (default 4)'
        required: false
        type: string
        default: '4'
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

# Cancel a superseded PR run (it is on a stale commit); never cancel a
# push/schedule run — it is already producing the post-merge/nightly signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e
    # Run on every trusted event. Skip untrusted PRs (forks + Dependabot) where
    # the secret is withheld — they would otherwise hard-fail the preflight.
    if: >-
      github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    # Bounded file parallelism (DSH_E2E_MAX_WORKERS), 120s/test, retry 2. 45m
    # still bounds retry storms against a slow API while the happy path fans out.
    timeout-minutes: 45
    env:
      # Single source of truth for the credential PAIR the preflight and the
      # test step use, so the two can never disagree about which key is being
      # sent to which endpoint.
      #
      # The pair must be resolved TOGETHER, never independently. Resolving the
      # key and the base URL from two separate fallback chains let a key
      # belonging to one provider be sent to a different provider's endpoint
      # (CUSTOM_API_KEY won the key chain while DSH_BASE_URL won the URL chain),
      # so every real-model call failed. Because a failed call surfaces as a
      # hang rather than an error, each such test burned its full
      # 120s x 3-attempt retry budget instead of failing fast, the job never
      # finished inside 45m, and the cancellation hid the real cause — the lane
      # has produced 0 successes in every run on record.
      #
      # Pairing rule: an explicit `api_base_url` input is by definition a CUSTOM
      # endpoint and therefore pairs with CUSTOM_API_KEY. With no such input we
      # target the default gateway (DSH_BASE_URL), which pairs with DSH_API_KEY.
      # This mirrors the wiring in team-e2e-cloud.yml, where that pair is
      # already proven to work.
      DEEPSEEK_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.api_base_url && secrets.CUSTOM_API_KEY)
        || secrets.DSH_API_KEY
        || secrets.DEEPSEEK_API_KEY_EXTERNAL
        || secrets.CUSTOM_API_KEY
        || secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ inputs.api_base_url || secrets.DSH_BASE_URL || secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Install
      # bwrap so trusted CI exercises it; the userns knob is best-effort and the
      # test's functional probe decides.
      - name: Install bubblewrap (unrestrict userns)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent — the functional probe decides"

      # Guard against a false green: the e2e suites self-skip when the key is
      # absent, so a missing/misconfigured secret would otherwise pass as
      # "all skipped". This job only runs on trusted events (the `if:` above
      # excludes keyless PRs), so the secret MUST be present — fail loudly if not.
      #
      # Beyond presence, make one REAL model call. A credential pair that is
      # present but rejected is this lane's actual failure: the suite boots,
      # every model call fails, every test sits out its full 120s x 3 retry
      # budget, and the 45m cap kills the job before any error is printed. That
      # is how this lane produced 0 successes in 417 recorded runs while
      # reporting nothing but "cancelled". Probing here converts a 45-minute
      # cancellation into a ~15-second failure that names the HTTP status.
      #
      # team-e2e-cloud.yml already runs an equivalent probe, but there it is
      # diagnostic-only and every LLM step is `continue-on-error: true`, so the
      # same rejection leaves that lane green. Here it must gate.
      - name: Preflight (key present, endpoint serves chat/completions)
        env:
          # Same model fallback convention as team-e2e-cloud.yml.
          DSH_MODEL_NAME: ${{ secrets.DSH_MODEL || inputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::API key is empty. Configure one of: DSH_API_KEY, CUSTOM_API_KEY, DEEPSEEK_API_KEY_EXTERNAL, DEEPSEEK_API_KEY"
            exit 1
          fi
          echo "API key present."
          echo "Using API base URL: $DEEPSEEK_BASE_URL"

          base="${DEEPSEEK_BASE_URL%/}"
          model="${DSH_MODEL_NAME:-deepseek-chat}"

          # Informational only: which model ids the gateway advertises. Never
          # gates the job — a gateway may serve chat/completions while
          # refusing GET /models, so a failure here proves nothing on its own.
          curl -sS -m 20 -o /tmp/models.json -w 'GET /models -> HTTP %{http_code}\n' \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" "$base/models" || true
          head -c 300 /tmp/models.json 2>/dev/null || true
          echo

          # The gate: one real chat completion — exactly the capability the
          # suite depends on. Retry transient transport blips, then fail, so a
          # dead endpoint costs seconds instead of the whole budget.
          body=$(printf '{"model":"%s","messages":[{"role":"user","content":"ping"}],"max_tokens":4,"stream":false}' "$model")
          status=''
          for attempt in 1 2 3; do
            status="$(curl -sS -o /tmp/chat.json -w '%{http_code}' \
              -X POST "$base/chat/completions" \
              -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data "$body" --max-time 30 || echo '000')"
            echo "attempt ${attempt}: POST chat/completions (model=${model}) -> HTTP ${status}"
            case "$status" in
              2??) break ;;
            esac
            [ "$attempt" = 3 ] || sleep $((attempt * 5))
          done

          # Never echo a credential-shaped token from a response body.
          redact() { sed -E 's/sk-[A-Za-z0-9_-]{4,}/[REDACTED]/g'; }

          case "$status" in
            2??)
              echo "Endpoint serves chat/completions; proceeding."
              head -c 300 /tmp/chat.json | redact || true
              echo
              ;;
            401|403)
              echo "::error::Endpoint rejected the credential (HTTP ${status}) at ${base}/chat/completions. The key does not belong to this endpoint, or it is expired/unauthorized — every real-model test would otherwise burn its full timeout. Provision a valid key for this endpoint."
              head -c 300 /tmp/chat.json | redact || true
              echo
              exit 1
              ;;
            400|404)
              echo "::error::Endpoint authenticated but refused model '${model}' (HTTP ${status}). Set the DSH_MODEL secret to a model this gateway actually serves."
              head -c 300 /tmp/chat.json | redact || true
              echo
              exit 1
              ;;
            *)
              echo "::error::Real-model endpoint unusable (HTTP ${status}) at ${base}/chat/completions. Fix the credential/endpoint pair before spending the e2e budget."
              head -c 300 /tmp/chat.json | redact || true
              echo
              exit 1
              ;;
          esac

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: pnpm run build

      # Real-API end-to-end tests. Supports any OpenAI-compatible API.
      # DEEPSEEK_BASE_URL can point to any endpoint; non-official endpoints
      # auto-skip official-only suites (model-specific assertions) via
      # vitest.e2e.config.ts. Generic e2e (fs, shell, headless, web) runs
      # against whatever endpoint is configured.
      - name: E2E tests (real API)
        env:
          # DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL come from the job-level env so
          # the pair cannot drift from what the preflight just verified.
          # Custom model override (empty string for default model).
          DSH_MODEL: ${{ inputs.model || '' }}
          # Parallel workers: workflow_dispatch input or default 4.
          DSH_E2E_MAX_WORKERS: ${{ inputs.max_workers || '4' }}
          DSH_EXAMPLE_MODE: lib
        run: |
          # Emit a machine-readable report alongside the console output. The
          # console summary is only printed once the whole run finishes, so a
          # job killed at the timeout cap loses every failure detail — which is
          # exactly how this lane stayed opaque. A per-file JSON report written
          # as tests complete survives the kill and is uploaded below.
          mkdir -p e2e-report
          set +e
          pnpm run test:e2e -- --reporter=default --reporter=json --outputFile=e2e-report/results.json
          status=$?
          set -e
          echo "exit status: ${status}"
          exit "${status}"

      # Always upload, including on cancellation: the report is the only record
      # of which tests failed and why when the job is killed mid-run.
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report/
          if-no-files-found: warn
          retention-days: 14
